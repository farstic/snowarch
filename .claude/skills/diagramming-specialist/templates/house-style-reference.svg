<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <!-- ===================================================================== -->
  <!-- Diagramming Specialist HOUSE-STYLE REFERENCE (designed-first).         -->
  <!-- Reuse <defs> verbatim; lay out nodes as rounded "cards" with two text -->
  <!-- lines. Baseline = solid; custom-pending = dashed red + PENDING tag.   -->
  <!-- Palette is the single source of truth in SKILL.md > House style.       -->
  <!-- ===================================================================== -->
  <defs>
    <linearGradient id="gPlat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaf1"/><stop offset="1" stop-color="#d6f0e1"/>
    </linearGradient>
    <linearGradient id="gActor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ff"/><stop offset="1" stop-color="#e0e4fd"/>
    </linearGradient>
    <linearGradient id="gExt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <linearGradient id="gCfg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#fdeccf"/>
    </linearGradient>
    <linearGradient id="gPend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5f5"/><stop offset="1" stop-color="#fde4e4"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.2" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="560" rx="18" fill="url(#gBg)"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0f172a">Incident &#8594; Azure DevOps &#8212; Resolve Sync</text>
  <text x="40" y="74" font-size="14" fill="#64748b">A P1/P2 incident resolving creates an Azure DevOps work item</text>
  <line x1="40" y1="92" x2="1020" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>

  <g stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrow)" fill="none">
    <line x1="190" y1="176" x2="248" y2="176"/>
    <line x1="400" y1="176" x2="458" y2="176"/>
    <line x1="610" y1="176" x2="668" y2="176"/>
    <line x1="820" y1="176" x2="878" y2="176"/>
    <line x1="325" y1="212" x2="325" y2="326"/>
  </g>
  <line x1="535" y1="212" x2="540" y2="326" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrowRed)" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="40"  y="140" width="150" height="72" rx="14" fill="url(#gActor)" stroke="#6366f1" stroke-width="1.6"/>
    <rect x="250" y="140" width="150" height="72" rx="14" fill="url(#gPlat)"  stroke="#18a558" stroke-width="1.6"/>
    <rect x="460" y="140" width="150" height="72" rx="14" fill="url(#gPlat)"  stroke="#18a558" stroke-width="1.6"/>
    <rect x="670" y="140" width="150" height="72" rx="14" fill="url(#gPlat)"  stroke="#18a558" stroke-width="1.6"/>
    <rect x="880" y="140" width="150" height="72" rx="14" fill="url(#gExt)"   stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle">
    <text x="115" y="172" font-size="15" font-weight="600" fill="#3730a3">Agent</text>
    <text x="115" y="192" font-size="11.5" fill="#6366f1">itil</text>
    <text x="325" y="172" font-size="15" font-weight="600" fill="#0a5c38">ServiceNow</text>
    <text x="325" y="192" font-size="11.5" fill="#3b7a5a">incident</text>
    <text x="535" y="172" font-size="15" font-weight="600" fill="#0a5c38">Flow Designer</text>
    <text x="535" y="192" font-size="11.5" fill="#3b7a5a">trigger: P1/P2 resolved</text>
    <text x="745" y="172" font-size="15" font-weight="600" fill="#0a5c38">ADO Spoke</text>
    <text x="745" y="192" font-size="11.5" fill="#3b7a5a">IntegrationHub</text>
    <text x="955" y="172" font-size="15" font-weight="600" fill="#334155">Azure DevOps</text>
    <text x="955" y="192" font-size="11.5" fill="#64748b">REST / OAuth2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="326" width="190" height="62" rx="14" fill="url(#gCfg)" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="445" y="326" width="210" height="62" rx="14" fill="url(#gPend)" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <g text-anchor="middle">
    <text x="325" y="352" font-size="13.5" font-weight="600" fill="#92400e">incident.u_ado_ref</text>
    <text x="325" y="372" font-size="11" fill="#b45309">custom field &#183; configuration</text>
    <text x="550" y="352" font-size="13.5" font-weight="600" fill="#b91c1c">x_acme_ado_sync_log</text>
    <text x="550" y="372" font-size="11" fill="#dc2626">CUSTOM &#183; PENDING &#167;1.1</text>
  </g>
  <text x="335" y="280" font-size="10.5" fill="#94a3b8" text-anchor="middle">set on resolve</text>
  <text x="560" y="280" font-size="10.5" fill="#dc2626" text-anchor="middle">log attempt</text>

  <g font-size="11.5" fill="#475569">
    <rect x="40" y="486" width="15" height="15" rx="4" fill="url(#gPlat)" stroke="#18a558"/>
    <text x="62" y="498">ServiceNow platform</text>
    <rect x="210" y="486" width="15" height="15" rx="4" fill="url(#gActor)" stroke="#6366f1"/>
    <text x="232" y="498">Actor / role</text>
    <rect x="330" y="486" width="15" height="15" rx="4" fill="url(#gExt)" stroke="#94a3b8"/>
    <text x="352" y="498">External system</text>
    <rect x="480" y="486" width="15" height="15" rx="4" fill="url(#gCfg)" stroke="#f59e0b"/>
    <text x="502" y="498">Custom field (config)</text>
    <rect x="660" y="486" width="15" height="15" rx="4" fill="url(#gPend)" stroke="#dc2626" stroke-dasharray="4 3"/>
    <text x="682" y="498">Custom object &#183; PENDING &#167;1.1</text>
  </g>
  <text x="1020" y="540" font-size="10.5" fill="#cbd5e1" text-anchor="end">Diagramming Specialist &#183; designed house style</text>
</svg>
